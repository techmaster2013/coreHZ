<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>coreHZ</title>
  <link rel="icon" type="image/png" href="coreHZ.png">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main>
    <header class="rise">
      <img src="banner.png" alt="coreHZ" draggable="false">
      <p>A collection of web apps, games, AI tools, and utilities — built into one GamePlaza-style workspace.</p>
    </header>

    <section class="grid" aria-label="Applications">

      <button class="cell mineral span-2 rise" data-launch="mineral">
        <span class="chip chip-mineral" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </span>
        <span class="meta">
          <span class="name">zzCraft Launcher</span>
          <span class="desc">Play modern Minecraft in your browser, unblockable!</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </button>

      <button class="cell compact slate rise" data-launch="slate">
        <span class="chip chip-slate" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </span>
        <span class="meta">
          <span class="name">Slate AI</span>
          <span class="desc">An unblocked AI, extremely smart!</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </button>

      <button class="cell compact magma rise" data-launch="magma">
        <span class="chip chip-magma" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </span>
        <span class="meta">
          <span class="name">Magma</span>
          <span class="desc">An Alpine Linux based mini operating system, runs entirely in your browser!</span>
        </span>
        <span class="go" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </button>

      <a class="cell quiet span-2 rise" href="feed.html">
        <span class="chip chip-feedback" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
        </span>
        <span class="meta">
          <span class="name name-sm">Feedback</span>
          <span class="desc">Report bugs, request features, or share suggestions.</span>
        </span>
        <span class="pill">Send feedback</span>
      </a>

      <a class="cell quiet span-2 rise" href="https://discord.gg/azBXGMsm5F" target="_blank" rel="noopener noreferrer">
        <span class="chip chip-discord" aria-hidden="true">
          <svg viewBox="0 0 127.14 96.36" fill="currentColor">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.72-11A68.6,68.6,0,0,1,28.4,79.51c.85-.63,1.68-1.3,2.47-2a75.46,75.46,0,0,0,65.44,0c.79.68,1.62,1.35,2.47,2a68.52,68.52,0,0,1-10.37,5.87,74.83,74.83,0,0,0,6.72,11,105.56,105.56,0,0,0,31.07-18.83C129.7,50.12,123.81,27.31,107.7,8.07Z"/>
            <circle cx="42.78" cy="47.54" r="8.76" fill="#7b1fa2"/>
            <circle cx="84.36" cy="47.54" r="8.76" fill="#7b1fa2"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name name-sm">SysPlaza Discord</span>
          <span class="desc">Get updates pings, and request features!</span>
        </span>
        <span class="pill">Join here!</span>
      </a>

    </section>

    <footer class="rise">
      <span class="mark">© 2026 coreHZ</span>
      <span class="est">SysPlaza Ecosystem</span>
    </footer>
  </main>

  <script src="index.js"></script>
</body>
</html>
