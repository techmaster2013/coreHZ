<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coreHZ</title>
<link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
<style>
  html, body { margin:0; height:100%; background:#09090b; overflow:hidden;
               font-family:Arial, Helvetica, sans-serif; }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:22px;
            transition:opacity .25s ease; }
  #loader img { width:220px; max-width:70vw; pointer-events:none; opacity:.95; }
  .wordmark { display:none; color:#fafafa; font-weight:700; font-size:17px;
              letter-spacing:.45em; text-indent:.45em; }
  .bar { width:130px; height:2px; border-radius:2px; overflow:hidden;
         background:rgba(255,255,255,.08); }
  .bar i { display:block; width:40%; height:100%; border-radius:2px;
           background:rgba(255,255,255,.5);
           animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(330%); } }

  #error { position:fixed; inset:0; display:none; flex-direction:column;
           align-items:center; justify-content:center; padding:28px;
           text-align:center; overflow:auto; box-sizing:border-box; background:#09090b; }
  #error img { width:190px; max-width:60vw; opacity:.9; margin-bottom:22px; }
  #error h1 { color:#fafafa; font-size:15px; font-weight:700; margin:0 0 8px; }
  #error .reason { color:#a1a1aa; font-size:12.5px; line-height:1.6;
                   max-width:460px; margin:0 0 16px; }
  #error pre { color:#71717a; font:11px/1.7 monospace; text-align:left;
               white-space:pre-wrap; background:rgba(255,255,255,.03);
               border:1px solid rgba(255,255,255,.07); border-radius:8px;
               padding:12px 14px; max-width:540px; margin:0 0 18px; }
  #error button { background:#fff; color:#000; border:0; border-radius:6px;
                  padding:9px 24px; font:600 13px Arial; cursor:pointer; }
  #error button:hover { background:#e4e4e7; }

  #frame { position:fixed; inset:0; width:100%; height:100%; border:0;
           display:none; background:#000; }
</style>
</head>
<body>

  <div id="loader">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShrlhoZUPFN7jDh7IZB0v_zE_wIcwI7BEqWxffW8V86A&s=10" alt="" draggable="false">
    <span class="wordmark" id="loaderWordmark">COREHZ</span>
    <div class="bar"><i></i></div>
  </div>

  <div id="error">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShrlhoZUPFN7jDh7IZB0v_zE_wIcwI7BEqWxffW8V86A&s=10" alt="" draggable="false"
         onerror="this.style.display='none';document.getElementById('errWordmark').style.display='block'">
    <span class="wordmark" id="errWordmark">COREHZ</span>
    <h1>coreHZ couldn't load</h1>
    <p class="reason" id="reason"></p>
    <pre id="detail"></pre>
    <button id="retry">Retry now</button>
  </div>

  <iframe id="frame" referrerpolicy="no-referrer"
          allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; camera; microphone"></iframe>

<script>
/* =======================================================================
   COREHZ LAUNCHER — fire-and-forget shell. Never needs updating:
   all design + functionality lives in the hub pulled from GitHub.
   ======================================================================= */
const CONFIG = {
  SOURCES: [
    "Mantle.html"
  ],
  CACHE_KEY: "corehz.hub.cache.v1",
  SPOOF: [
    { title: "Google Docs",      icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" },
    { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
    { title: "Google Drive",     icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" }
  ]
};

/* ---- stealth: spoof THIS tab. The hub runs in an iframe, so its own
   title/favicon code can't reach the tab — the shell handles it. ---- */
(function () {
  const s = CONFIG.SPOOF[Math.floor(Math.random() * CONFIG.SPOOF.length)];
  const apply = () => {
    if (document.title !== s.title) document.title = s.title;
    let l = document.querySelector("link[rel~='icon']");
    if (!l) { l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
    if (l.href !== s.icon) l.href = s.icon;
  };
  apply();
  setInterval(apply, 1000);
})();

/* ---- if the placeholder image is unreachable, degrade to a plain wordmark ---- */
document.querySelector("#loader img").addEventListener("error", function () {
  this.style.display = "none";
  document.getElementById("loaderWordmark").style.display = "block";
});

/* ---- fetch the hub: mirrors in order, then last cached copy ---- */
let hubPromise = null;
function getHub() {
  if (!hubPromise) {
    hubPromise = (async () => {
      let lastErr;
      for (const url of CONFIG.SOURCES) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status + " from " + new URL(url, location.href).host);
          const html = await res.text();
          // Reject school block pages / captive portals that return 200
          if (html.length < 200 || !/<html/i.test(html) || !/corehz/i.test(html))
            throw new Error("Response from " + new URL(url, location.href).host + " wasn't the coreHZ hub");
          try { localStorage.setItem(CONFIG.CACHE_KEY, html); } catch (_) {}
          return html;
        } catch (e) { lastErr = e; }
      }
      const cached = (() => { try { return localStorage.getItem(CONFIG.CACHE_KEY); } catch (_) { return null; } })();
      if (cached) return cached;
      throw lastErr || new Error("All sources failed");
    })().catch(e => { hubPromise = null; throw e; });
  }
  return hubPromise;
}

/* ---- write the hub into the iframe ---- */
function install(html, doc) {
  doc.open();
  doc.write(html);
  doc.close();
}

/* ---- boot: no click required ---- */
const frame  = document.getElementById("frame");
const loader = document.getElementById("loader");
const errBox = document.getElementById("error");
let busy = false;

async function boot() {
  if (busy || frame.style.display === "block") return;
  busy = true;
  errBox.style.display = "none";
  loader.style.display = "flex";
  try {
    const html = await getHub();
    install(html, frame.contentDocument);
    frame.style.display = "block";
    loader.style.opacity = "0";
    setTimeout(() => loader.remove(), 300);
  } catch (e) {
    loader.style.display = "none";
    showError(e);
    setTimeout(boot, 12000);
  } finally {
    busy = false;
  }
}

function showError(e) {
  document.getElementById("reason").textContent =
    "It will keep retrying automatically. If this is the first run on a " +
    "school network, open the file once on a home network — it saves an " +
    "offline copy for exactly this situation.";
  document.getElementById("detail").textContent =
    (e && e.message ? e.message : String(e)) +
    "\n\nTried:\n" + CONFIG.SOURCES.map(u => "  " + u).join("\n") +
    "\n\nIf every source is blocked on this network, add another mirror " +
    "to CONFIG.SOURCES in this file and re-share it.";
  errBox.style.display = "flex";
}

document.getElementById("retry").addEventListener("click", boot);
boot();
</script>
</body>
</html>
